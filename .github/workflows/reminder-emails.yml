name: Reminder emails

# Free alternative to a paid Render Cron Job (CB, Sept 2026 — Render's Cron Jobs have no free
# tier, and this repo already lives on GitHub, so a scheduled Action reuses an account she
# already has instead of adding a new paid resource or a new third-party service). Pings the
# cron endpoints a Render Cron Job would've hit on a schedule:
#   - POST /api/cron/clockout-reminders  (src/lib/clockout-reminders.ts — "you're still clocked in")
#   - POST /api/cron/clockin-reminders   (src/lib/clockin-reminders.ts  — "your shift starts soon."
#     Oct 2026: replaces the retired /api/cron/shift-reminders, same lead-time reminder but keyed
#     on the Shift model instead of the older AvailabilitySubmission one — see that file's own
#     doc comment for why.)
#   - POST /api/cron/auto-clockout       (src/lib/auto-clockout.ts      — force-closes a session
#     left open past 4 hours, per CB Sept 2026: "it went over twelve hours, and then it
#     documented it to be twelve hours. I don't necessarily want that")
#   - POST /api/cron/scheduled-messages  (src/lib/direct-messages.ts's sendDueScheduledMessages —
#     "Schedule message," Sept 2026: dispatches any DM whose scheduledFor has passed. Not an
#     email despite this workflow's name — same shared-secret shape as the other jobs, just a
#     different kind of "thing that happens on a timer" reusing the same free schedule.)
#   - POST /api/cron/announcement-notifications (src/lib/announcement-notifications.ts — Oct 2026,
#     My Profile > Notifications: notifies/emails the right recipients once a (possibly
#     future-dated) announcement's publishDate actually arrives.)
#   - POST /api/cron/notification-emails (src/lib/notification-emails.ts — CB, Sept 2026: "we
#     need to make sure that any notification goes to their email as well so they know." Emails
#     every in-app Notification (src/lib/notifications.ts's writeNotification — shift/availability/
#     PTO/task/announcement/message events) that hasn't been emailed yet, per that recipient's own
#     My Profile > Notifications preferences for the two Oct 2026 types.)
#   - POST /api/cron/date-task-reminders (src/lib/date-task-reminders.ts — CB, Oct 2026, round
#     two: "we get some reminders to approve their tasks... I don't want them to forget." The
#     follow-up to DATE_TASK_SUBMITTED's one-time submit notification: once a task's sat in
#     AWAITING_REVIEW for 24 hours, and once a day again for as long as it keeps sitting there,
#     re-notifies the same reviewers.)
# All seven are idempotent/self-limiting server-side (dedup tracking for the reminder and
# notification-email jobs, auto-clockout only ever touches a session that's already past its cap
# so a late or doubled-up run can't force-close something early, and scheduled-messages only ever
# flips a row that's still unsent past its own due time) and tolerate a few minutes of scheduling
# jitter — GitHub's own docs note scheduled workflows can run a few minutes late under load, which
# is fine here but wouldn't be for something needing exact timing (a message scheduled for
# 3:00 PM goes out sometime in that run's window, not necessarily on the minute).
#
# Requires a repository secret named CRON_SECRET, matching the CRON_SECRET set on the Render
# web service's own environment — see README's "Clock-out reminders"/"Shift reminders"
# sections. Add it under this repo's Settings -> Secrets and variables -> Actions -> New
# repository secret.
#
# Known GitHub quirk worth knowing about: GitHub automatically disables a scheduled workflow
# after 60 days with no commits to the repo at all (any commit, not just to this file) — if
# reminders quietly stop, check Actions -> this workflow for a "disabled" banner and re-enable
# it there, or push any small commit to reset the clock.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab to test it

jobs:
  ping-reminder-endpoints:
    runs-on: ubuntu-latest
    steps:
      - name: Clock-out reminders
        run: |
          curl -sS -X POST https://ttc-hr-portal.onrender.com/api/cron/clockout-reminders \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Clock-in reminders
        run: |
          curl -sS -X POST https://ttc-hr-portal.onrender.com/api/cron/clockin-reminders \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Auto clock-out
        run: |
          curl -sS -X POST https://ttc-hr-portal.onrender.com/api/cron/auto-clockout \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Scheduled messages
        run: |
          curl -sS -X POST https://ttc-hr-portal.onrender.com/api/cron/scheduled-messages \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Announcement notifications
        run: |
          curl -sS -X POST https://ttc-hr-portal.onrender.com/api/cron/announcement-notifications \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Notification emails
        run: |
          curl -sS -X POST https://ttc-hr-portal.onrender.com/api/cron/notification-emails \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Date task review reminders
        run: |
          curl -sS -X POST https://ttc-hr-portal.onrender.com/api/cron/date-task-reminders \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
