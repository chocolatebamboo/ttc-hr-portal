name: Reminder emails

# Free alternative to a paid Render Cron Job (CB, Sept 2026 — Render's Cron Jobs have no free
# tier, and this repo already lives on GitHub, so a scheduled Action reuses an account she
# already has instead of adding a new paid resource or a new third-party service). Pings the
# cron endpoints a Render Cron Job would've hit on a schedule:
#   - POST /api/cron/clockout-reminders  (src/lib/clockout-reminders.ts — "you're still clocked in")
#   - POST /api/cron/shift-reminders     (src/lib/shift-reminders.ts    — "your shift starts soon")
#   - POST /api/cron/auto-clockout       (src/lib/auto-clockout.ts      — force-closes a session
#     left open past 4 hours, per CB Sept 2026: "it went over twelve hours, and then it
#     documented it to be twelve hours. I don't necessarily want that")
#   - POST /api/cron/scheduled-messages  (src/lib/direct-messages.ts's sendDueScheduledMessages —
#     "Schedule message," Sept 2026: dispatches any DM whose scheduledFor has passed. Not an
#     email despite this workflow's name — same shared-secret shape as the other three, just a
#     different kind of "thing that happens on a timer" reusing the same free schedule.)
# All four are idempotent/self-limiting server-side (dedup tracking for the two reminder jobs,
# auto-clockout only ever touches a session that's already past its cap so a late or doubled-up
# run can't force-close something early, and scheduled-messages only ever flips a row that's
# still unsent past its own due time) and tolerate a few minutes of scheduling jitter — GitHub's
# own docs note scheduled workflows can run a few minutes late under load, which is fine here but
# wouldn't be for something needing exact timing (a message scheduled for 3:00 PM goes out
# sometime in that run's window, not necessarily on the minute).
#
# Requires a repository secret named CRON_SECRET, matching the CRON_SECRET set on the Render
# web service's own environment — see README's "Clock-out reminders"/"Shift reminders"
# sections. Add it under this repo's Settings -> Secrets and variables -> Actions -> New
# repository secret.
#
# Known GitHub quirk worth knowing about: GitHub automatically disables a scheduled workflow
# after 60 days with no commits to the repo at all (any commit, not just to this file) — if
# reminders quietly stop, check Actions -> this workflow for a "disabled" banner and re-enable
# it there, or push any small commit to reset the clock.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab to test it

jobs:
  ping-reminder-endpoints:
    runs-on: ubuntu-latest
    steps:
      - name: Clock-out reminders
        run: |
          curl -sS -X POST https://ttc-hr-portal.onrender.com/api/cron/clockout-reminders \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Shift reminders
        run: |
          curl -sS -X POST https://ttc-hr-portal.onrender.com/api/cron/shift-reminders \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Auto clock-out
        run: |
          curl -sS -X POST https://ttc-hr-portal.onrender.com/api/cron/auto-clockout \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Scheduled messages
        run: |
          curl -sS -X POST https://ttc-hr-portal.onrender.com/api/cron/scheduled-messages \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
